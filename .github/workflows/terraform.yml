name: Terraform security checks

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/**"
      - ".tflint.hcl"
      - "README.md"
      - ".gitignore"
      - "docs/**"
      - "dashboard/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"
      - ".tflint.hcl"
      - "README.md"
      - ".gitignore"
      - "docs/**"
      - "dashboard/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, validate, test, and scan Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Run plan-only Terraform tests
        run: terraform test -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint plugins
        run: tflint --init
        working-directory: .

      - name: Run TFLint
        run: tflint --recursive --format compact
        working-directory: .

      - name: Set up Python for Checkov
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov

      - name: Scan Terraform with Checkov
        run: checkov --directory . --framework terraform --compact --soft-fail
